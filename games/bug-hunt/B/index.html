<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spark Run — Bug Hunt</title>
  <style>
    :root { color-scheme: dark; --ink:#eaf7ff; --muted:#8faabd; --panel:#102334; --cyan:#55e6ff; --pink:#ff5e91; --gold:#ffd35a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow-x:hidden; background:#07121d; color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
    .wrap { width:min(1100px, calc(100% - 32px)); margin:0 auto; padding:28px 0 36px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(1.8rem,4vw,3rem); letter-spacing:.04em; } 
    .eyebrow { margin:0 0 4px; color:var(--cyan); text-transform:uppercase; letter-spacing:.15em; font-size:.75rem; font-weight:800; }
    .subtitle { color:var(--muted); margin:5px 0 0; }
    .hud { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .chip { min-width:92px; padding:8px 12px; background:var(--panel); border:1px solid #214258; border-radius:10px; text-align:center; }
    .chip b { display:block; color:var(--gold); font-size:1.35rem; line-height:1.1; }
    .chip span { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    button { min-height:44px; border:0; border-radius:9px; padding:11px 18px; color:#06131b; background:var(--cyan); font:700 1rem inherit; cursor:pointer; box-shadow:0 4px 0 #2695aa; transition:transform .12s, filter .12s; }
    button:hover { filter:brightness(1.1); } button:active { transform:translateY(3px); box-shadow:0 1px 0 #2695aa; }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    #reset { background:#253b4d; color:var(--ink); box-shadow:0 4px 0 #142532; }
    #action { position:absolute; z-index:4; left:50%; top:50%; min-width:150px; transform:translate(-50%,-50%); }
    #action:active { transform:translate(-50%,-50%) translateY(3px); }
    .instructions { color:var(--muted); font-size:.9rem; text-align:right; }
    .stage { position:relative; width:100%; max-width:1000px; height:min(62vw,540px); min-height:340px; overflow:hidden; border:1px solid #214258; border-radius:16px; background:radial-gradient(circle at 30% 30%,#173c50 0,#0d2536 42%,#081722 100%); box-shadow:inset 0 0 70px #030b11, 0 14px 45px #02070c; touch-action:none; }
    .stage::before { content:""; position:absolute; inset:0; opacity:.35; background-image:linear-gradient(#2b647a 1px,transparent 1px),linear-gradient(90deg,#2b647a 1px,transparent 1px); background-size:42px 42px; pointer-events:none; }
    .stage.playing { border-color:#3e9ab0; }
    .entity { position:absolute; z-index:2; transform:translate(-50%,-50%); pointer-events:none; }
    .player { width:28px; height:28px; border-radius:50%; background:var(--cyan); border:3px solid #d6fbff; box-shadow:0 0 18px var(--cyan); }
    .player::after { content:""; position:absolute; inset:7px; border-radius:50%; background:#0b5268; }
    .enemy { width:42px; height:42px; border-radius:50%; background:var(--pink); border:3px solid #ffd2df; box-shadow:0 0 25px #ff477b; }
    .enemy::after { content:""; position:absolute; inset:10px; border-radius:50%; background:#6b1640; }
    .spark { width:19px; height:19px; border-radius:50%; background:var(--gold); border:3px solid #fff2af; box-shadow:0 0 18px var(--gold); animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform:translate(-50%,-50%) scale(1.25); } }
    .stage-message { position:absolute; inset:0; display:grid; place-items:center; z-index:3; pointer-events:none; text-align:center; padding:20px; }
    .stage-message strong { display:block; font-size:clamp(1.2rem,3vw,2rem); } .stage-message span { color:var(--muted); }
    .hidden { display:none !important; }
    .result { min-height:28px; margin:12px 2px 0; font-weight:700; color:var(--gold); }
    .result.loss { color:#ff87ad; }
    .result.win { color:#7effcf; }
    @media (max-width:650px) { .wrap { width:calc(100% - 20px); padding-top:18px; } header { display:block; } .hud { justify-content:flex-start; margin-top:15px; } .toolbar { align-items:flex-start; } .instructions { font-size:.78rem; max-width:180px; } .stage { min-height:320px; height:calc(100vw - 20px); } }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><p class="eyebrow">Neon sector / 01</p><h1>Spark Run</h1><p class="subtitle">Collect five sparks. Don’t touch the hunter.</p></div><div class="hud" aria-label="Game statistics"><div class="chip"><b id="score" data-testid="score">0 / 5</b><span>Sparks</span></div><div class="chip"><b id="best">0</b><span>Best</span></div></div></header>
    <div class="toolbar"><div><button id="start" data-testid="start" type="button">Start run</button><button id="reset" type="button">Reset</button></div><div class="instructions">Arrow keys / WASD to steer<br>Tap or drag inside the arena</div></div>
    <section id="stage" class="stage" data-testid="stage" aria-label="Spark Run game arena" tabindex="0">
      <div id="player" class="entity player" aria-hidden="true"></div><div id="enemy" class="entity enemy" aria-hidden="true"></div><div id="spark" class="entity spark" aria-hidden="true"></div>
      <button id="action" data-testid="primary-action" type="button">Start run</button>
      <div id="stageMessage" class="stage-message"><div><strong>Ready when you are</strong><span>Press Start to enter the arena</span></div></div>
    </section>
    <p id="result" data-testid="result" class="result" role="status" aria-live="polite"></p>
  </main>
<script>
(() => {
  'use strict';
  const stage = document.querySelector('[data-testid="stage"]'), playerEl = document.getElementById('player'), enemyEl = document.getElementById('enemy'), sparkEl = document.getElementById('spark');
  const startEl = document.querySelector('[data-testid="start"]'), actionEl = document.querySelector('[data-testid="primary-action"]'), scoreEl = document.querySelector('[data-testid="score"]'), resultEl = document.querySelector('[data-testid="result"]'), messageEl = document.getElementById('stageMessage'), bestEl = document.getElementById('best');
  const maxSparks = 5, key = 'bench.spark-run.best-score';
  let state = { phase:'ready', score:0, progress:0, player:{x:0,y:0}, enemy:{x:0,y:0}, spark:{x:0,y:0} }, raf = 0, last = 0, pointerActive = false;
  let best = Number(localStorage.getItem(key) || 0); bestEl.textContent = best;
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  function bounds() { return { w:stage.clientWidth, h:stage.clientHeight }; }
  function place(el, p) { el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; }
  function randomSpark() { const b=bounds(); state.spark={x:clamp(55+Math.random()*(b.w-110),55,b.w-55),y:clamp(55+Math.random()*(b.h-110),55,b.h-55)}; place(sparkEl,state.spark); }
  function render() { place(playerEl,state.player); place(enemyEl,state.enemy); scoreEl.textContent=state.score+' / '+maxSparks; }
  function distance(a,b) { return Math.hypot(a.x-b.x,a.y-b.y); }
  function finish(won) { state.phase=won?'won':'lost'; cancelAnimationFrame(raf); raf=0; stage.classList.remove('playing'); actionEl.classList.remove('hidden'); actionEl.textContent='Run again'; messageEl.classList.remove('hidden'); messageEl.innerHTML=won?'<div><strong>Sector cleared!</strong><span>All five sparks recovered</span></div>':'<div><strong>Hunter contact</strong><span>Reset and try another route</span></div>'; resultEl.textContent=won?'Run complete — nice flying.':'Run over — the hunter caught you.'; resultEl.className='result '+(won?'win':'loss'); startEl.textContent='Run again'; }
  function collect() { if(state.phase!=='playing') return; if(distance(state.player,state.spark)<42) { state.score++; state.progress=state.score; if(state.score>best){best=state.score;localStorage.setItem(key,String(best));bestEl.textContent=best;} if(state.score>=maxSparks){finish(true);return;} randomSpark(); actionEl.textContent='Dash to next spark'; render(); } }
  function moveTo(x,y) { if(state.phase!=='playing') return; const b=bounds(); state.player.x=clamp(x,18,b.w-18); state.player.y=clamp(y,18,b.h-18); render(); collect(); }
  function tick(now) { if(state.phase!=='playing') return; const dt=Math.min(32,now-last||16); last=now; const dx=state.player.x-state.enemy.x,dy=state.player.y-state.enemy.y,d=Math.hypot(dx,dy)||1; const speed=38+state.score*3; state.enemy.x+=dx/d*speed*dt/1000;state.enemy.y+=dy/d*speed*dt/1000; render(); if(distance(state.player,state.enemy)<34){finish(false);return;} raf=requestAnimationFrame(tick); }
  function start() { cancelAnimationFrame(raf); const b=bounds(); state.phase='playing';state.score=0;state.progress=0;state.player={x:Math.max(32,b.w*.12),y:b.h*.5};state.enemy={x:b.w*.82,y:b.h*.2}; resultEl.textContent='';resultEl.className='result'; stage.classList.add('playing');messageEl.classList.add('hidden');actionEl.classList.remove('hidden');startEl.textContent='Restart run';randomSpark();render();last=performance.now();raf=requestAnimationFrame(tick);stage.focus(); }
  function reset() { cancelAnimationFrame(raf);raf=0;state={phase:'ready',score:0,progress:0,player:{x:0,y:0},enemy:{x:0,y:0},spark:{x:0,y:0}};stage.classList.remove('playing');actionEl.classList.remove('hidden');actionEl.textContent='Start run';messageEl.classList.remove('hidden');messageEl.innerHTML='<div><strong>Ready when you are</strong><span>Press Start to enter the arena</span></div>';resultEl.textContent='';resultEl.className='result';startEl.textContent='Start run';render(); }
  function act() { if(state.phase==='ready'||state.phase==='won'||state.phase==='lost'){start();return;} moveTo(state.spark.x,state.spark.y); }
  startEl.addEventListener('click',start); document.getElementById('reset').addEventListener('click',reset); actionEl.addEventListener('click',act);
  window.addEventListener('keydown', e => { if(state.phase!=='playing') return; const k=e.key.toLowerCase(), step=24; if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();moveTo(state.player.x+(k==='arrowright'||k==='d'?step:k==='arrowleft'||k==='a'?-step:0),state.player.y+(k==='arrowdown'||k==='s'?step:k==='arrowup'||k==='w'?-step:0));} });
  stage.addEventListener('pointerdown',e=>{pointerActive=true;stage.setPointerCapture(e.pointerId);const r=stage.getBoundingClientRect();moveTo(e.clientX-r.left,e.clientY-r.top);}); stage.addEventListener('pointermove',e=>{if(pointerActive){const r=stage.getBoundingClientRect();moveTo(e.clientX-r.left,e.clientY-r.top);}}); stage.addEventListener('pointerup',()=>{pointerActive=false;}); stage.addEventListener('pointercancel',()=>{pointerActive=false;});
  window.__benchmark={start,act,complete:()=>{if(state.phase!=='playing')start(); while(state.phase==='playing'&&state.score<maxSparks) moveTo(state.spark.x,state.spark.y);},reset,getState:()=>({phase:state.phase,score:state.score,progress:state.progress})};
  reset();
})();
</script>
</body>
</html>
