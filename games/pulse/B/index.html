<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Stop</title>
<style>
:root{--bg:#080b18;--panel:#11162a;--panel2:#171e38;--ink:#f5f7ff;--muted:#929bb9;--cyan:#5ce1e6;--violet:#a78bfa;--pink:#fa70b5;--green:#72efb2;--line:rgba(255,255,255,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 50% -10%,#25336d 0,#10152b 34%,var(--bg) 75%);overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.shell{width:min(980px,calc(100% - 40px));margin:auto;padding:40px 0 32px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:11px;font-weight:800;color:var(--cyan);margin:0 0 10px}.title{font-size:clamp(34px,6vw,58px);line-height:.95;letter-spacing:-.06em;margin:0;font-weight:850}.subtitle{color:var(--muted);margin:13px 0 0;font-size:14px}.stats{display:flex;gap:10px}.stat{background:rgba(17,22,42,.8);border:1px solid var(--line);border-radius:14px;padding:11px 15px;min-width:92px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.13em}.stat strong{display:block;font-size:22px;margin-top:3px}
.card{position:relative;background:linear-gradient(145deg,rgba(23,30,56,.94),rgba(12,16,32,.97));border:1px solid rgba(255,255,255,.14);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.08);padding:28px;overflow:hidden}.card:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:var(--violet);filter:blur(100px);opacity:.1;right:-180px;top:-190px;pointer-events:none}.roundline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.roundlabel{font-size:13px;color:var(--muted)}.roundlabel b{color:var(--ink);font-size:16px}.pips{display:flex;gap:8px}.pip{width:34px;height:7px;border-radius:10px;background:#293151}.pip.active{background:var(--cyan);box-shadow:0 0 14px var(--cyan)}.pip.done{background:var(--violet)}
.stage{position:relative;min-height:310px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:radial-gradient(ellipse at 50% 45%,rgba(49,67,137,.33),rgba(8,12,27,.7) 65%),repeating-linear-gradient(90deg,transparent 0,transparent 9.9%,rgba(255,255,255,.035) 10%);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;user-select:none}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(92,225,230,.07),transparent 20%,transparent 80%,rgba(167,139,250,.06));pointer-events:none}.stage.ready .trackwrap{opacity:.35}.trackwrap{width:86%;position:relative;z-index:1}.trackmeta{display:flex;justify-content:space-between;color:#aab3d0;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin:0 2px 15px}.track{height:18px;border-radius:20px;background:#090d1d;border:1px solid rgba(255,255,255,.16);position:relative;box-shadow:inset 0 2px 7px #000,0 0 0 7px rgba(255,255,255,.02)}.target{position:absolute;top:-5px;height:26px;border-radius:8px;background:linear-gradient(90deg,rgba(114,239,178,.26),rgba(92,225,230,.4));border:1px solid var(--green);box-shadow:0 0 23px rgba(92,225,230,.45),inset 0 0 14px rgba(114,239,178,.22)}.marker{position:absolute;top:-10px;width:8px;height:38px;border-radius:8px;background:#fff;box-shadow:0 0 8px #fff,0 0 20px var(--cyan),0 0 38px var(--cyan);transform:translateX(-50%);will-change:left}.ticks{display:flex;justify-content:space-between;margin-top:12px;color:#596381;font-size:10px}.prompt{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#abb4d1;font-size:13px}.prompt kbd{border:1px solid #697397;background:#252d4c;border-radius:5px;padding:2px 7px;color:#fff;font-size:11px;box-shadow:0 2px 0 #080b16;margin:0 4px}
.feedback{height:43px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:750;letter-spacing:.01em;color:var(--muted);transition:color .2s}.feedback.hit{color:var(--green)}.feedback.miss{color:var(--pink)}.feedback span{font-size:25px;margin-right:9px}.actionrow{display:flex;gap:13px;align-items:center;justify-content:center}.action{border:0;border-radius:13px;padding:15px 31px;background:linear-gradient(135deg,var(--cyan),#77a7ff);color:#081022;font-weight:850;letter-spacing:.02em;box-shadow:0 7px 24px rgba(92,225,230,.23);transition:transform .15s,filter .15s}.action:hover{filter:brightness(1.1);transform:translateY(-2px)}.action:active{transform:translateY(1px)}.secondary{border:1px solid var(--line);border-radius:13px;padding:14px 20px;background:rgba(255,255,255,.045);font-weight:700;color:#d4d9ed}.secondary:hover{background:rgba(255,255,255,.09)}
.result{min-height:74px;margin-top:20px;text-align:center;border-top:1px solid var(--line);padding-top:19px;color:var(--muted);font-size:14px}.result strong{color:var(--ink);font-size:20px}.result .win{color:var(--green)}.hidden{display:none!important}.shake{animation:shake .32s ease}.pulse{animation:pulse .45s ease}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(114,239,178,.12)}}
@media(max-width:620px){.shell{width:calc(100% - 24px);padding-top:25px}.top{margin-bottom:20px;display:block}.stats{margin-top:20px}.stat{flex:1}.card{padding:16px;border-radius:20px}.stage{min-height:285px}.trackwrap{width:89%}.action{width:100%}.actionrow{display:block}.secondary{width:100%;margin-top:10px}.result{margin-top:13px}.title{font-size:45px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><p class="eyebrow">Reflex laboratory / 01</p><h1 class="title">PULSE STOP</h1><p class="subtitle">Catch the signal in the green. Precision beats speed.</p></div><div class="stats"><div class="stat"><span>Total</span><strong data-testid="score">0</strong></div><div class="stat"><span>Best</span><strong id="best">—</strong></div></div></header>
<section class="card"><div class="roundline"><div class="roundlabel">SEQUENCE <b id="roundText">Ready</b></div><div class="pips"><i class="pip" id="pip1"></i><i class="pip" id="pip2"></i><i class="pip" id="pip3"></i></div></div>
<div class="stage ready" data-testid="stage" id="stage" role="button" tabindex="0" aria-label="Timing track. Click to stop the marker"><div class="trackwrap"><div class="trackmeta"><span>low</span><span>target lock</span><span>high</span></div><div class="track" id="track"><div class="target" id="target"></div><div class="marker" id="marker"></div></div><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div><div class="prompt" id="prompt">Press <kbd>SPACE</kbd> or tap the track to begin</div></div>
<div class="feedback" id="feedback" aria-live="polite"><span>✦</span><em>Three signals. One clean sequence.</em></div><div class="actionrow"><button class="action" data-testid="primary-action" id="action">Start sequence</button><button class="secondary" data-testid="start" id="restart">Restart</button></div><div class="result" data-testid="result" id="result" aria-live="polite">Your best run is saved locally on this device.</div></section>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage=$('#stage'), marker=$('#marker'), target=$('#target'), action=$('#action'), restart=$('#restart'), scoreEl=$('[data-testid="score"]'), bestEl=$('#best'), roundText=$('#roundText'), feedback=$('#feedback'), result=$('#result'), prompt=$('#prompt');
  const key='bench.pulse-stop.best';
  const rounds=[{width:25,speed:0.00055},{width:19,speed:0.00082},{width:14,speed:0.00112}];
  let state={phase:'ready',score:0,progress:0,round:0,roundScores:[]}, raf=0, startedAt=0;
  const readBest=()=>Number(localStorage.getItem(key)||0);
  const render=()=>{scoreEl.textContent=state.score; bestEl.textContent=readBest()||'—'; roundText.textContent=state.phase==='ready'?'Ready':state.phase==='won'?'Complete':state.round+' / 3'; for(let i=1;i<=3;i++) $('#pip'+i).className='pip '+(i<state.round?'done':i===state.round?'active':'');};
  function setTarget(){const r=rounds[state.round-1]; const center=[50,42,61][state.round-1]; target.style.width=r.width+'%';target.style.left=(center-r.width/2)+'%';}
  function loop(t){if(state.phase!=='playing')return; const r=rounds[state.round-1]; const x=(Math.sin((t-startedAt)*r.speed)+1)*50; marker.style.left=x+'%'; raf=requestAnimationFrame(loop);}
  function start(){cancelAnimationFrame(raf);state={phase:'playing',score:0,progress:0,round:1,roundScores:[]};stage.classList.remove('ready');feedback.className='feedback';feedback.innerHTML='<span>✦</span><em>Find the pulse inside the green zone.</em>';result.textContent='';prompt.textContent='Tap, click, or press SPACE to stop';action.textContent='Stop pulse';setTarget();render();startedAt=performance.now();raf=requestAnimationFrame(loop);}
  function act(){if(state.phase==='ready'||state.phase==='won'||state.phase==='completed'){start();return}if(state.phase!=='playing')return; cancelAnimationFrame(raf); const x=parseFloat(marker.style.left)||0; const left=parseFloat(target.style.left), width=parseFloat(target.style.width); const distance=Math.abs(x-(left+width/2)); const accuracy=Math.max(0,Math.round(100-(distance/(50-width/2))*100)); state.roundScores.push(accuracy);state.score+=accuracy;state.progress=state.round;state.phase='resolving';render();const hit=accuracy>=50; feedback.className='feedback '+(hit?'hit':'miss'); feedback.innerHTML='<span>'+(hit?'✓':'×')+'</span><em>'+(hit?'Signal locked · '+accuracy+'% accuracy':'Signal missed · '+accuracy+'% accuracy')+'</em>';stage.classList.remove('pulse','shake');void stage.offsetWidth;stage.classList.add(hit?'pulse':'shake');action.disabled=true;setTimeout(()=>{if(state.round<3){state.round++;state.phase='playing';action.disabled=false;action.textContent='Stop pulse';setTarget();feedback.className='feedback';feedback.innerHTML='<span>✦</span><em>Next signal incoming…</em>';render();startedAt=performance.now();raf=requestAnimationFrame(loop)}else{finish()}},650);}
  function finish(){state.phase='won';state.progress=3;const best=readBest();if(state.score>best)localStorage.setItem(key,state.score);render();action.disabled=false;action.textContent='Play again';prompt.textContent='Sequence complete';const avg=Math.round(state.score/3);feedback.className='feedback hit';feedback.innerHTML='<span>✦</span><em>All signals processed</em>';result.innerHTML='<strong class="win">Run complete · '+state.score+' / 300</strong><br>Average precision '+avg+'%'+(state.score>best?' · New personal best':'');}
  function reset(){cancelAnimationFrame(raf);action.disabled=false;state={phase:'ready',score:0,progress:0,round:0,roundScores:[]};marker.style.left='0%';target.style.width='25%';target.style.left='37.5%';stage.className='stage ready';roundText.textContent='Ready';feedback.className='feedback';feedback.innerHTML='<span>✦</span><em>Three signals. One clean sequence.</em>';prompt.innerHTML='Press <kbd>SPACE</kbd> or tap the track to begin';action.textContent='Start sequence';result.textContent='Your best run is saved locally on this device.';render();}
  restart.addEventListener('click',reset);action.addEventListener('click',act);stage.addEventListener('click',e=>{if(e.target!==action)act()});stage.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();act()}});document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();act()}});
  window.__benchmark={start,act,complete(){if(state.phase==='ready')start();if(state.phase==='playing')act();if(state.phase==='resolving'){for(let i=state.round;i<3;i++)state.roundScores.push(100);state.score+=(3-state.round)*100;state.round=3;finish()}else if(state.phase!=='won')finish()},reset,getState:()=>JSON.parse(JSON.stringify(state))};
  render();
})();
</script>
</body>
</html>
